<header class="site-header">
  <div class="site-header__inner">
    <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="AS, Austin Schmid home">AS<span aria-hidden="true">.</span></a>
    <nav class="site-nav" aria-label="Primary navigation">
      <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>Home</a>
      <a href="{{ '/about/' | relative_url }}" {% if page.url contains '/about' %}aria-current="page"{% endif %}>About</a>
      <a href="{{ '/work-experience/' | relative_url }}" {% if page.url contains '/work-experience' %}aria-current="page"{% endif %}>Experience</a>
      <a href="{{ '/contact/' | relative_url }}" {% if page.url contains '/contact' %}aria-current="page"{% endif %}>Contact</a>
    </nav>
    <button class="theme-toggle" type="button" aria-label="Switch to dark theme" aria-pressed="false">
      <span class="theme-toggle__icon theme-toggle__icon--sun" aria-hidden="true">☼</span>
      <span class="theme-toggle__icon theme-toggle__icon--moon" aria-hidden="true">◐</span>
      <span class="sr-only">Toggle theme</span>
    </button>
  </div>
</header>
